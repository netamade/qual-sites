<!doctype html>

<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAGE_TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --accent: {{THEME}};
      --ink: #192d29;
      --muted: #50635e;
      --line: #d8e0dc;
      --paper: #f5f7f4;
      --surface: #fff;
      --tint: color-mix(in srgb, var(--accent) 8%, white);
      font-family: "Hiragino Sans", "Yu Gothic", Meiryo, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--paper); color: var(--ink); line-height: 1.65; }
    a { color: var(--accent); text-underline-offset: .2em; }
    button, select { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { line-height: 1.3; }
    h2 { font-size: clamp(1.3rem, 3vw, 1.8rem); letter-spacing: -.03em; }
    h3 { font-size: 1.05rem; }
    .wrap { width: min(100% - 36px, 1080px); margin-inline: auto; }
    .top { border-bottom: 1px solid var(--line); background: var(--surface); }
    .top .wrap, .nav, .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .top .wrap { min-height: 65px; justify-content: space-between; padding-block: 10px; }
    .brand { font-weight: 800; color: var(--ink); text-decoration: none; }
    .brand::before { content: ""; display: inline-block; width: 12px; height: 16px; margin-right: 8px; border: 2px solid var(--accent); border-left-width: 4px; border-radius: 2px; vertical-align: -.12em; }
    .nav { column-gap: 20px; font-size: .9rem; }
    .nav a { color: var(--muted); }
    main { padding-block: 26px 48px; }
    section { scroll-margin-top: 16px; }
    .hero, .card { border-radius: 19px; }
    .hero {
      color: white; padding: clamp(24px, 5vw, 52px);
      display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(220px, 1fr); gap: 24px; align-items: center;
      background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 62%, #172720), var(--accent));
    }
    .hero h1 { font-size: clamp(1.9rem, 5vw, 3.3rem); overflow-wrap: anywhere; letter-spacing: -.055em; }
    .hero p { margin-top: 10px; }
    .hero .actions { margin-top: 22px; }
    .hero :focus-visible { outline-color: white; }
    .schedule { padding: 16px 19px; border: 1px solid #ffffff65; border-radius: 13px; background: #1622212a; }
    .schedule p { margin-top: 5px; font-size: .88rem; }
    #exam-status { font-size: clamp(1.24rem, 2.5vw, 1.75rem); }
    .card { background: var(--surface); border: 1px solid var(--line); padding: clamp(17px, 3.5vw, 28px); }
    .section-head { margin-bottom: 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 14px; }
    .section-head p, .muted { color: var(--muted); }
    .home-section { margin-top: 26px; }
    .mode-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .mode {
      display: flex; align-items: flex-start; flex-direction: column; gap: 7px; min-height: 112px;
      text-align: left; background: white; color: var(--ink); border: 1px solid var(--line);
      border-radius: 12px; padding: 15px; font-weight: 800;
    }
    .mode:hover, .mode[aria-pressed="true"] { border-color: var(--accent); background: var(--tint); }
    .mode span { color: var(--muted); font-size: .85rem; font-weight: 400; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
      padding: 8px 15px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--surface); color: var(--ink); font-weight: 750; text-decoration: none;
    }
    .btn:hover { border-color: var(--accent); }
    .primary { background: var(--accent); color: white; border-color: var(--accent); }
    .hero .primary { background: white; color: var(--accent); border-color: white; }
    .hero .btn:not(.primary) { background: transparent; color: white; border-color: #ffffff80; }
    .notice { margin: 12px 0 0; padding: 10px 13px; border-radius: 9px; background: var(--tint); }
    .picker { margin-top: 14px; }
    select {
      min-height: 44px; max-width: 100%; padding: 7px; background: white; color: var(--ink);
      border: 1px solid #80918a; border-radius: 8px;
    }
    .dashboard { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(0, 1.3fr); gap: 20px; align-items: start; }
    .chart { display: grid; justify-items: center; text-align: center; align-self: center; margin: 0; }
    canvas { display: block; width: min(100%, 300px); height: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 7px 5px; text-align: left; border-bottom: 1px solid var(--line); }
    td:not(:first-child), th:not(:first-child) { text-align: right; white-space: nowrap; }
    .pass { margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--line); }
    .pass p, .book p { margin-top: 5px; }
    .details { margin-top: 9px; font-size: .9rem; }
    summary { cursor: pointer; }
    .sources { display: flex; flex-wrap: wrap; gap: 2px 16px; padding-left: 20px; }
    .book { background: var(--tint); }
    footer { border-top: 1px solid var(--line); padding: 18px 0; font-size: .85rem; color: var(--muted); }
    .quiz { max-width: 790px; margin: auto; }
    .quiz > .card { margin-top: 12px; }
    .quiz-heading { margin: 0 0 12px; }
    .quiz-meta { display: flex; flex-wrap: wrap; gap: 4px 15px; margin-top: 8px; color: var(--muted); font-size: .88rem; }
    progress { width: 100%; height: 10px; accent-color: var(--accent); }
    .stem, .explanation-text { white-space: pre-wrap; overflow-wrap: anywhere; }
    .stem { margin: 16px 0; font-size: 1.16rem; font-weight: 750; }
    .choices { display: grid; gap: 9px; }
    .choice { width: 100%; text-align: left; justify-content: flex-start; white-space: pre-wrap; overflow-wrap: anywhere; }
    .choice:disabled { cursor: default; opacity: 1; }
    .choice.right { background: #e4f3ec; border-color: #35745d; }
    .choice.wrong { background: #e8eef9; border-color: #34548f; }
    .feedback { margin-top: 18px; padding: 16px; border-radius: 12px; background: var(--tint); }
    .verdict { text-align: center; margin-bottom: 10px; }
    .verdict.ok { color: #ac2b18; }
    .verdict.ng { color: #34548f; }
    .feedback ul, .feedback ol { padding-left: 1.5em; }
    .feedback li { margin-block: 7px; overflow-wrap: anywhere; }
    .quiz .actions { margin-top: 14px; }
    .fb-mark{width:84px;height:84px;display:block;margin:0 auto 8px;animation:fb-pop .25s ease-out}
    .fb-batsu{width:64px;height:64px}
    @keyframes fb-pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
    @media (prefers-reduced-motion: reduce){.fb-mark{animation:none}}
    @media (max-width: 760px) { .mode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) {
      .hero, .dashboard { grid-template-columns: minmax(0, 1fr); }
      .mode { min-height: 104px; }
      .wrap { width: calc(100% - 26px); }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" id="home-link" href="./">練習サイト</a>
      <nav class="nav" id="home-nav" aria-label="ページ内メニュー">
        <a href="#practice">練習モード</a><a href="#learning">学習状況</a><a href="#book">書籍情報</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div id="home">
      <section class="hero" aria-labelledby="site-title">
        <div>
          <h1 id="site-title">{{EXAM_TITLE}}</h1>
          <p id="book-subtitle"></p>
          <div class="actions">
            <button type="button" id="daily" class="btn primary" disabled>今日のランダム問題</button>
            <button type="button" id="resume" class="btn" hidden>続きから</button>
          </div>
        </div>
        <div class="schedule">
          <div id="exam-name"></div>
          <h2 id="exam-status"></h2>
          <p id="exam-date"></p>
        </div>
      </section>
      <section id="practice" class="home-section card" aria-labelledby="practice-title">
        <div class="section-head"><h2 id="practice-title" tabindex="-1">練習モード</h2><p id="question-count"></p></div>
        <div class="mode-grid" id="modes"></div>
        <form class="picker" id="field-form" hidden>
          <div class="actions">
            <label for="field">分野</label>
            <select id="field" required></select>
            <button class="btn primary">この分野で練習</button>
          </div>
        </form>
        <p id="practice-notice" class="notice" role="status">問題データを読み込み中です</p>
      </section>
      <section id="learning" class="home-section card" aria-labelledby="learning-title">
        <div class="section-head"><h2 id="learning-title">学習状況</h2><p>分野ごとの習熟度</p></div>
        <div class="dashboard">
          <figure class="chart">
            <canvas id="radar" width="600" height="600" aria-hidden="true"></canvas>
            <figcaption id="radar-note" class="muted"></figcaption>
          </figure>
          <table aria-label="分野別学習状況">
            <thead><tr><th scope="col">分野</th><th scope="col">解答済み</th><th scope="col">正答率</th></tr></thead>
            <tbody id="field-stats"></tbody>
          </table>
        </div>
        <div class="pass">
          <h3>合格目安ライン</h3>
          <p id="pass-line"></p>
          <details class="details"><summary>試験の公式情報</summary><ul class="sources" id="sources"></ul></details>
        </div>
      </section>
      <section id="book" class="home-section card book" aria-labelledby="book-heading">
        <h2 id="book-heading">書籍情報</h2>
        <p id="book-name"></p><p id="book-status" class="muted"></p>
      </section>
    </div>
    <section class="quiz" id="quiz" aria-label="練習問題" hidden></section>
    <noscript><p class="notice">練習サイトを利用するには JavaScript を有効にしてください。</p></noscript>
  </main>
  <footer><div class="wrap" id="storage-status" role="status">学習記録はこのブラウザーに保存されます。</div></footer>
  <template id="correct-mark">
    <svg class="fb-mark fb-hanamaru" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 C72 4 92 22 94 46 C96 71 78 93 53 95 C28 97 7 79 6 54 C5 29 26 8 50 6 Z" fill="none" stroke="#e03a1e" stroke-width="5" stroke-linecap="round"/><path d="M50 18 C66 17 81 30 82 47 C83 65 69 82 52 83 C35 84 19 70 18 53 C17 35 33 19 50 18 Z" fill="none" stroke="#e03a1e" stroke-width="4" stroke-linecap="round"/><path d="M38 38 C44 30 58 29 64 37 M34 55 C31 45 36 33 45 29 M66 55 C69 65 63 76 54 79 M45 68 C53 73 65 70 69 61" fill="none" stroke="#e03a1e" stroke-width="4" stroke-linecap="round"/></svg>
  </template>
  <template id="incorrect-mark">
    <svg class="fb-mark fb-batsu" viewBox="0 0 100 100" aria-hidden="true"><path d="M22 22 L78 78 M78 22 L22 78" stroke="#34548f" stroke-width="11" stroke-linecap="round" fill="none"/></svg>
  </template>
  <script>
{{ENGINE}}
  </script>
</body>
</html>
